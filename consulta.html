<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>División Inmobiliaria · Terralia — Consulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A24; --ink-soft:#2C3E36; --paper:#F4F1E9; --paper-2:#EDE8DC;
  --card:#FFFFFF; --brass:#B4894C; --brass-deep:#8A6A38; --brass-soft:#E7D9BF;
  --sage:#5F7A64; --sage-soft:#E3EAE0; --clay:#B0563C; --clay-soft:#F0DDD3;
  --line:#E3DDD0; --line-soft:#EFEADF; --muted:#726D60; --ink-70:rgba(27,42,36,.72);
  --shadow:0 1px 2px rgba(27,42,36,.05),0 8px 28px -12px rgba(27,42,36,.18);
  --shadow-lg:0 24px 60px -20px rgba(27,42,36,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  font-size:13px;line-height:1.42;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:.01em}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--brass-deep)}
.muted{color:var(--muted)}

/* Layout */
.app{display:grid;grid-template-columns:198px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#EDE8DC;padding:20px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px}
.brand{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid rgba(237,232,220,.14)}
.brand .mark{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1;color:#fff}
.brand .mark span{color:var(--brass)}
.brand .sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);margin-top:8px;font-weight:600}
.navlink{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:#D5CFC2;
  font-size:12.5px;font-weight:500;transition:.18s;text-align:left;width:100%}
.navlink:hover{background:rgba(237,232,220,.07);color:#fff}
.navlink.active{background:var(--brass);color:var(--ink);font-weight:600}
.navlink .ic{width:15px;height:15px;flex:none;opacity:.9}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(237,232,220,.14);font-size:11px;color:#9A958A;line-height:1.6}

.main{min-width:0;padding:0 0 80px}
.topbar{background:rgba(244,241,233,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:13px 26px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.topbar .title h1{font-size:23px}
.topbar .title .eyebrow{margin-bottom:7px}
.fx-pill{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted)}
.fx-pill b{color:var(--ink);font-weight:600}
.view{padding:20px 26px 0;max-width:1320px}
.view.hidden{display:none}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.kpi{padding:12px 14px;border-right:1px solid var(--line-soft)}
.kpi:last-child{border-right:none}
.kpi .k-lab{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.kpi .k-val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.kpi .k-val.sm{font-size:13.5px}
.kpi .k-sub{font-size:9.5px;color:var(--sage);margin-top:3px;font-weight:600}

/* Section head */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:16px;flex-wrap:wrap}
.sec-head h2{font-size:21px}
.sec-head .eyebrow{margin-bottom:6px}

/* Filters */
.filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.filter-grp .f-lab{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:11.5px;
  font-weight:500;color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--brass)}
.chip.active{background:var(--ink);color:#F4F1E9;border-color:var(--ink)}
.chip .ct{opacity:.5;font-size:11px;margin-left:5px}

/* Property grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
  transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--brass-soft)}
.pcard .banner{height:74px;background:var(--ink);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:11px}
.pcard .banner .pattern{position:absolute;inset:0;opacity:.5}
.pcard .banner .tipo-tag{position:absolute;top:9px;left:11px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;color:var(--ink);background:var(--brass);padding:4px 9px;border-radius:5px;z-index:2}
.pcard .banner .estatus{position:absolute;top:9px;right:11px;font-size:10.5px;font-weight:600;color:#EDE8DC;z-index:2;
  display:flex;align-items:center;gap:6px}
.pcard .banner .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.pcard .banner .flag{position:relative;z-index:2;font-size:11px;color:var(--brass-soft);font-weight:600;letter-spacing:.05em}
.pcard .body{padding:11px 13px 12px}
.pcard .emp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-deep);font-weight:600}
.pcard h3{font-size:17px;margin:3px 0 2px;line-height:1.05}
.pcard .loc{font-size:11px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.pcard .mstrip{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.pcard .m .m-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pcard .m .m-v{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;margin-top:3px}
.pcard .m .m-v.pos{color:var(--sage)}
.pcard .m .m-v.debt{color:var(--clay)}

.cur-badge{font-size:9.5px;padding:2px 6px;border-radius:4px;background:var(--brass-soft);color:var(--brass-deep);
  font-weight:700;letter-spacing:.05em;vertical-align:middle}

/* Group label for catalog-by */
.grouplabel{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:8px 0 0}
.grouplabel:first-child{margin-top:0}
.grouplabel h3{font-size:15px;color:var(--ink)}
.grouplabel .rule{flex:1;height:1px;background:var(--line)}
.grouplabel .n{font-size:12px;color:var(--muted);font-weight:600}

/* Tables */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.tbl-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.tbl-head h3{font-size:15px}
.tbl-head .desc{font-size:11px;color:var(--muted);max-width:460px}
table{width:100%;border-collapse:collapse}
th{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper-2)}
th:first-child{text-align:left}
.xtd{}
td{padding:7px 12px;border-bottom:1px solid var(--line-soft);text-align:right;font-size:12px}
td:first-child{text-align:left;font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--paper)}
tr.total-row td{background:var(--paper-2);font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--sage);font-weight:600}
.debt{color:var(--clay);font-weight:600}
.rank{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--brass);
  align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:9px;font-family:'IBM Plex Mono',monospace}
.bar-cell{position:relative}
.bar-cell .bar{position:absolute;left:16px;bottom:6px;height:3px;background:var(--brass);border-radius:2px;opacity:.85}

/* Cash flow chart */
.flowchart{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.flowbars{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:16px;padding-bottom:2px}
.fb{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fb .col{width:100%;max-width:38px;background:linear-gradient(180deg,var(--brass) 0%,var(--brass-deep) 100%);
  border-radius:5px 5px 0 0;transition:.3s;position:relative;min-height:2px}
.fb .col.big{background:linear-gradient(180deg,var(--clay) 0%,#8f4530 100%)}
.fb .col:hover{filter:brightness(1.08)}
.fb .col .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:7px;background:var(--ink);
  color:#fff;font-size:10.5px;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;
  font-family:'IBM Plex Mono',monospace;z-index:5}
.fb .col:hover .tip{opacity:1}
.fb .lab{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap;transform:rotate(-42deg);transform-origin:center;height:26px}

/* Detail / ficha */
.overlay{position:fixed;inset:0;background:rgba(27,42,36,.5);backdrop-filter:blur(4px);z-index:60;
  display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:.28s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{width:min(680px,94vw);background:var(--paper);height:100vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  transform:translateX(40px);transition:.32s cubic-bezier(.22,1,.36,1)}
.overlay.open .drawer{transform:translateX(0)}
.drawer-hero{background:var(--ink);color:#EDE8DC;padding:20px 26px 22px;position:relative;overflow:hidden}
.drawer-hero .pattern{position:absolute;inset:0;opacity:.4}
.drawer-hero .close{position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;
  background:rgba(237,232,220,.12);color:#fff;font-size:18px;z-index:3;transition:.15s}
.drawer-hero .close:hover{background:rgba(237,232,220,.24)}
.drawer-hero .rel{position:relative;z-index:2}
.drawer-hero .emp{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600}
.drawer-hero h2{font-size:26px;color:#fff;margin:6px 0 5px}
.drawer-hero .sub{font-size:13px;color:#C7C1B4}
.drawer-hero .tags{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dtag{font-size:11px;padding:5px 11px;border-radius:100px;background:rgba(237,232,220,.1);color:#EDE8DC;font-weight:500}
.dtag.brass{background:var(--brass);color:var(--ink);font-weight:600}
.drawer-body{padding:20px 26px 44px}
.d-section{margin-bottom:20px}
.d-section .d-lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-deep);font-weight:600;
  margin-bottom:10px;display:flex;align-items:center;gap:10px}
.d-section .d-lab .rule{flex:1;height:1px;background:var(--line)}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.metric{background:var(--card);padding:10px 13px}
.metric .ml{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.metric .mv{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:5px}
.metric .mv.pos{color:var(--sage)}.metric .mv.debt{color:var(--clay)}
.metric .mv.sm{font-size:14px}

/* Admin form */
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:500;transition:.15s;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--brass);background:#fff;box-shadow:0 0 0 3px var(--brass-soft)}
.field .hint{font-size:11px;color:var(--muted);font-family:'Inter'}
.form-actions{display:flex;gap:12px;margin-top:16px;align-items:center}
.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;transition:.16s;display:inline-flex;align-items:center;gap:9px}
.btn-primary{background:var(--brass);color:var(--ink)}
.btn-primary:hover{background:var(--brass-deep);color:#fff}
.btn-ghost{border:1px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn-ghost:hover{border-color:var(--ink)}
.saved-flash{font-size:13px;color:var(--sage);font-weight:600;opacity:0;transition:.2s;display:flex;align-items:center;gap:6px}
.saved-flash.show{opacity:1}

/* Params */
.params-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.param-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 17px;box-shadow:var(--shadow)}
.param-card .pc-lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.param-card .pc-in{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.param-card .pc-in .cur{font-size:13px;color:var(--brass-deep);font-weight:600}
.param-card input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--ink)}
.param-card input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.gastos-note{font-size:12.5px;color:var(--muted);margin-top:-14px;margin-bottom:22px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:13px 24px;border-radius:100px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;
  pointer-events:none;transition:.28s;z-index:80;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--brass)}

@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;z-index:100;transition:.25s;width:248px}
  .sidebar.open{left:0}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(3){border-right:none}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--line-soft)}
  .view,.topbar{padding-left:22px;padding-right:22px}
  .menu-btn{display:flex!important}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
}
.menu-btn{display:none;width:42px;height:42px;border-radius:10px;background:var(--ink);color:#fff;
  align-items:center;justify-content:center;position:fixed;bottom:22px;right:22px;z-index:110;box-shadow:var(--shadow-lg)}

/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(27,42,36,.55);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:38px 16px;overflow-y:auto;opacity:0;pointer-events:none;transition:.22s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-card{width:min(680px,100%);background:var(--paper);border-radius:14px;box-shadow:var(--shadow-lg);transform:translateY(14px);transition:.24s;overflow:hidden}
.modal-overlay.open .modal-card{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 22px;background:var(--ink);color:#fff}
.modal-head h3{font-size:18px;color:#fff}
.close-m{width:30px;height:30px;border-radius:50%;background:rgba(237,232,220,.14);color:#fff;font-size:17px;transition:.15s}
.close-m:hover{background:rgba(237,232,220,.26)}
.modal-body{padding:18px 22px 22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
.d-lab2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-deep);font-weight:600;margin:16px 0 9px}
.d-lab2:first-child{margin-top:0}
.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:'Inter';font-weight:500;width:100%;transition:.15s}
.field select:focus{outline:none;border-color:var(--brass);background:#fff;box-shadow:0 0 0 3px var(--brass-soft)}
/* ---- imagen ---- */
.imgrow{display:flex;gap:16px;align-items:center}
.imgprev{width:132px;height:86px;border-radius:10px;background:var(--paper-2);background-size:cover;background-position:center;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.imgprev span{font-size:11px;color:var(--muted)}
.imgctrls{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.pcard-img{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.img-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,35,28,.02),rgba(20,35,28,.58));z-index:1}
.banner.has-img .tipo-tag,.banner.has-img .estatus,.banner.has-img .flag{z-index:3}
/* ---- hero actions ---- */
.hero-actions{display:flex;gap:8px;margin-top:15px}
.btn-hero{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;background:var(--brass);color:var(--ink);font-size:12.5px;font-weight:600;transition:.15s}
.btn-hero:hover{background:#c99a58}
.btn-hero.danger{background:rgba(237,232,220,.12);color:#EDE8DC}
.btn-hero.danger:hover{background:var(--clay);color:#fff}
/* ---- botones peque ---- */
.btn.sm{padding:7px 13px;font-size:12.5px}
.addbtn{white-space:nowrap}
/* ---- barra de gastos ---- */
.gasto-bar{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.gasto-bar select,.gasto-bar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-family:'Inter';font-size:13px;color:var(--ink)}
.gasto-bar select:focus,.gasto-bar input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.tot-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tot-chip{font-size:12px;padding:6px 12px;border-radius:100px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono'}
.tot-chip b{color:var(--ink);font-family:'Inter';font-weight:600;margin-right:5px}
.tot-chip.main{background:var(--ink);color:var(--brass-soft);border-color:var(--ink)}
.tot-chip.main b{color:#fff}
.tipo-badge{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--brass-soft);color:var(--brass-deep);font-weight:600}
.del-x{width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:16px;transition:.14s}
.del-x:hover{background:var(--clay-soft);color:var(--clay)}
.mini-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini-v{font-size:15px;font-weight:600;margin-top:4px}
@media(max-width:960px){.imgrow{flex-direction:column;align-items:flex-start}.gasto-bar{gap:12px}}


.import-opts{display:flex;flex-direction:column;gap:10px}
.imp-opt{text-align:left;border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card);transition:.15s;display:flex;flex-direction:column;gap:4px;width:100%}
.imp-opt:hover{border-color:var(--brass);background:var(--paper-2)}
.imp-opt b{font-size:14px;color:var(--ink)}
.imp-opt span{font-size:12px;color:var(--muted)}

/* auto-respaldo + checkbox */
.gh-status{font-size:10.5px;font-weight:600;margin-top:8px;letter-spacing:.02em}
.gh-status.ready{color:#9A958A}.gh-status.pending{color:var(--brass)}.gh-status.syncing{color:var(--brass)}
.gh-status.ok{color:#8FB58F}.gh-status.err{color:#E5A48F}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--brass)}
/* --- compactado 2 --- */
.view{padding-top:16px}
.kpis{margin-bottom:15px}
.kpi{padding:10px 13px}
.filters{margin-bottom:13px}
.tablewrap{margin-bottom:13px}
.flowchart{margin-bottom:13px;padding:16px 18px}
.d-section{margin-bottom:15px}
.admin-card{padding:14px 16px}
.params-grid{gap:10px;margin-bottom:13px}
.param-card{padding:13px 15px}
.modal-body{padding:15px 20px 20px}
.form-grid{gap:10px 13px}
.grid{gap:11px}
.gasto-bar{margin-bottom:12px}
.tot-chips{margin-bottom:12px}
.gastos-note{margin-bottom:14px}
td{padding:6px 12px}
th{padding:7px 12px}
.metric{padding:9px 12px}
.d-lab2{margin:13px 0 8px}

/* --- compactado 3 (fino) --- */
body{font-size:12.5px}
.topbar{padding:11px 24px}
.topbar .title h1{font-size:21px}
.sidebar{padding:18px 13px}
.view{padding-top:14px}
.kpis{margin-bottom:13px}
.kpi{padding:9px 12px}
.kpi .k-val{font-size:15px}
.kpi .k-val.sm{font-size:13px}
.sec-head{margin-bottom:12px}
.tablewrap{margin-bottom:12px}
.flowchart{margin-bottom:12px;padding:15px 17px}
.flowbars{height:135px}
.d-section{margin-bottom:14px}
.admin-card{padding:13px 15px}
.metric{padding:8px 11px}
.metric .mv{font-size:14px}
.drawer-hero{padding:17px 22px 18px}
.drawer-hero h2{font-size:24px}
.drawer-body{padding:16px 22px 40px}
.btn{padding:9px 15px;font-size:12.5px}
.pcard .banner{height:66px}
.pcard .body{padding:10px 12px 11px}
.pcard h3{font-size:16px}
.grid{gap:10px}
.filters{margin-bottom:12px;gap:14px}

.logo-img{background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:center}
.brand-logo{width:132px;height:40px;filter:brightness(0) invert(1);margin-bottom:2px}
#intro{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s ease,visibility .7s}
#intro.hide{opacity:0;visibility:hidden}
.intro-logo{width:min(440px,66vw);height:150px;animation:introIn 1.1s cubic-bezier(.22,1,.36,1)}
#intro .ln{width:0;height:2px;background:var(--brass);animation:introLine 2.6s .3s cubic-bezier(.22,1,.36,1) forwards}
#intro .eb{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass-deep);font-weight:600;opacity:0;animation:introFade 1s .6s forwards}
@keyframes introIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes introFade{to{opacity:1}}
@keyframes introLine{to{width:190px}}
.ro-pill{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brass-deep);background:var(--brass-soft);padding:4px 9px;border-radius:100px}
.edit-only,.addbtn,.del-x{display:none!important}

<script>
/* ================= ESTADO ================= */
const LS_KEY='abm_inmob_v2';
const READONLY=true;
let state = normalize(load());
function load(){ try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s);}catch(e){} return structuredClone(SEED); }
function normalize(s){
  s.fx=s.fx||{EUR:19.81,USD:17.46};
  s.github=s.github||{};
  s.github.owner=s.github.owner||'terraliaadm';
  s.github.repo=s.github.repo||'Terraliaprop';
  s.github.branch=s.github.branch||'main';
  s.github.folder=s.github.folder||'propiedades';
  if(s.github.auto===undefined)s.github.auto=true;
  s.props=(s.props||[]).map(p=>{const q={img:'',...p};delete q.g;return q;});
  if(!Array.isArray(s.gastos)) s.gastos=structuredClone(SEED.gastos||[]);
  return s;
}
function save(){}
function resetData(){ state=normalize(structuredClone(SEED)); save(); renderAll(); toast('Datos restablecidos al valor base'); }

const TODAY=new Date(2026,7,10);
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const TIPOS_GASTO=['Predial','Mantenimiento','Reparaciones','Interiorismo','Otro'];
const TIPO_ORDER=['Residencial','Vertical','Vacacional','Terreno','Oficinas','Industrial','Recreativo','Internacional'];
const EMP_ORDER=['TERRALIA','MASLOW','SOCIOS','FORTIA','FERTI FORTE','GRATIL'];
const ESTATUS=['Rentado','En operación','En Construcción','Desarrollo Futuro','Uso Corporativo','Reserva patrimonial','En proceso de venta'];
const CUR=['MXN','EUR','USD'];

/* ================= UTILIDADES ================= */
const fx=()=>state.fx;
const toMXN=(v,cur)=>cur==='MXN'?v:v*(fx()[cur]||1);
function gastosAnual(propId){
  const lim=new Date(TODAY);lim.setFullYear(lim.getFullYear()-1);
  return state.gastos.filter(g=>g.propId===propId&&new Date(g.fecha)>=lim).reduce((s,g)=>s+(+g.monto||0),0);
}
function computed(p){
  const plus=p.vm-p.va,plusPct=p.va?plus/p.va:0,patr=p.vm-p.adeudo;
  const rentaA=p.renta*12,gastosA=gastosAnual(p.id);
  const yB=p.vm?rentaA/p.vm:0,yN=p.vm?(rentaA-gastosA)/p.vm:0,ltv=p.vm?p.adeudo/p.vm:0;
  return {plus,plusPct,patr,rentaA,gastosA,yB,yN,ltv,
    vmMXN:toMXN(p.vm,p.cur),vaMXN:toMXN(p.va,p.cur),adeudoMXN:toMXN(p.adeudo,p.cur),
    patrMXN:toMXN(patr,p.cur),plusMXN:toMXN(plus,p.cur),rentaAMXN:toMXN(rentaA,p.cur),gastosAMXN:toMXN(gastosA,p.cur)};
}
const sym={MXN:'$',EUR:'€',USD:'US$'};
const money=(v,cur='MXN',dec=0)=>(sym[cur]||'$')+' '+Number(v||0).toLocaleString('es-MX',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const pct=(v,d=2)=>(v*100).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
function short(v){const a=Math.abs(v);if(a>=1e6)return '$'+(v/1e6).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1})+'M';if(a>=1e3)return '$'+(v/1e3).toLocaleString('es-MX',{maximumFractionDigits:0})+'k';return '$'+Math.round(v);}
const monthKey=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const fmtMes=s=>{const[y,m]=s.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const fmtFecha=s=>{const d=new Date(s);return String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const propName=id=>{const p=state.props.find(x=>x.id===id);return p?p.name:'—';};
const estatusColor=e=>({'Rentado':'var(--sage)','En operación':'var(--sage)','En Construcción':'var(--brass)','Desarrollo Futuro':'var(--brass)','Uso Corporativo':'#7C8AA0','Reserva patrimonial':'#7C8AA0','En proceso de venta':'var(--clay)'}[e]||'var(--muted)');
const PATTERN=`<svg class="pattern" viewBox="0 0 400 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24382F"/><stop offset="1" stop-color="#16241E"/></linearGradient></defs><rect width="400" height="160" fill="url(#g)"/><g stroke="#B4894C" stroke-width="1" opacity="0.22" fill="none"><path d="M60 160 L60 70 L120 40 L180 70 L180 160"/><path d="M120 40 L120 20 L150 8 L180 20 L180 70"/><path d="M200 160 L200 55 L280 55 L280 160 M230 55 L230 25 L250 25 L250 55"/><path d="M300 160 L300 80 L360 80 L360 160"/></g></svg>`;
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,16)+Math.random().toString(36).slice(2,5);
const uid=()=>'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ================= NAV ================= */
const VIEWS=['catalogo','analisis','adeudos','gastos','parametros'];
const TITLES={catalogo:['Cartera de inmuebles','Catálogo de propiedades'],analisis:['Indicadores de desempeño','Análisis del portafolio'],adeudos:['Compromisos financieros','Adeudos y flujo de pagos'],gastos:['Costos de operación','Gastos por propiedad'],parametros:['Configuración','Parámetros e integración']};
function nav(v){VIEWS.forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('.navlink').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.getElementById('tb-eyebrow').textContent=TITLES[v][0];document.getElementById('tb-title').textContent=TITLES[v][1];
  document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0);}
document.querySelectorAll('.navlink').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

/* ================= KPIs ================= */
function kpiStrip(){
  let vm=0,va=0,adeudo=0,patr=0,rentaA=0;
  state.props.forEach(p=>{const c=computed(p);vm+=c.vmMXN;va+=c.vaMXN;adeudo+=c.adeudoMXN;patr+=c.patrMXN;rentaA+=c.rentaAMXN;});
  const plus=vm-va,plusPct=va?plus/va:0,ltv=vm?adeudo/vm:0;
  return `<div class="kpis">
    <div class="kpi"><div class="k-lab">Inmuebles</div><div class="k-val">${state.props.length}</div><div class="k-sub">${new Set(state.props.map(p=>p.emp)).size} empresas</div></div>
    <div class="kpi"><div class="k-lab">Valor de mercado</div><div class="k-val sm">${money(vm)}</div></div>
    <div class="kpi"><div class="k-lab">Plusvalía</div><div class="k-val sm">${money(plus)}</div><div class="k-sub">${pct(plusPct)}</div></div>
    <div class="kpi"><div class="k-lab">Patrimonio neto</div><div class="k-val sm">${money(patr)}</div></div>
    <div class="kpi"><div class="k-lab">Adeudo total</div><div class="k-val sm" style="color:var(--clay)">${money(adeudo)}</div></div>
    <div class="kpi"><div class="k-lab">LTV / Renta anual</div><div class="k-val sm">${pct(ltv)}</div><div class="k-sub">${short(rentaA)}/año</div></div>
  </div>`;
}

/* ================= CATÁLOGO ================= */
let filterTipo='Todos',filterEmp='Todos',groupBy='tipo';
function bannerHTML(p){ return p.img?`<div class="pcard-img" style="background-image:url('${p.img}')"></div><div class="img-scrim"></div>`:PATTERN; }
function pcard(p){
  const c=computed(p);
  const flag=p.cur!=='MXN'?`<span class="flag">${p.cur==='EUR'?'España':'USD'} · ${p.cur}</span>`:'';
  return `<div class="pcard" data-id="${p.id}">
    <div class="banner ${p.img?'has-img':''}">${bannerHTML(p)}
      <span class="tipo-tag">${p.tipo}</span>
      <span class="estatus"><span class="dot" style="background:${estatusColor(p.estatus)}"></span>${p.estatus}</span>${flag}</div>
    <div class="body"><div class="emp">${p.emp}</div><h3>${p.name}</h3>
      <div class="loc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${p.ciudad}${p.zona?' · '+p.zona:''}${p.m2?' · '+(+p.m2).toLocaleString('es-MX')+' m²':''}</div>
      <div class="mstrip">
        <div class="m"><div class="m-l">Valor mercado</div><div class="m-v">${money(p.vm,p.cur)}</div></div>
        <div class="m"><div class="m-l">Plusvalía</div><div class="m-v pos">${pct(c.plusPct)}</div></div>
        <div class="m"><div class="m-l">${p.renta?'Yield':'Adeudo'}</div><div class="m-v ${p.renta?'':(p.adeudo?'debt':'')}">${p.renta?pct(c.yB):money(p.adeudo,p.cur)}</div></div>
        <div class="m"><div class="m-l">LTV</div><div class="m-v ${c.ltv?'debt':''}">${pct(c.ltv)}</div></div>
      </div></div></div>`;
}
function renderCatalogo(){
  const el=document.getElementById('view-catalogo');

/* ================= ADEUDOS Y FLUJO ================= */
function buildFlow(){
  const flows={};
  const add=(y,m,name,amt,tipo)=>{const k=monthKey(y,m);(flows[k]??={total:0,items:[]});flows[k].total+=amt;flows[k].items.push({name,amt,tipo});};
  state.props.forEach(p=>{if(!p.pago)return;const pg=p.pago;const ade=toMXN(p.adeudo,p.cur);const final=pg.pagoFinal?toMXN(pg.pagoFinal,p.cur):0;
    if(pg.mensualidad>0){const rem=Math.max(0,Math.round((ade-final)/pg.mensualidad));let y=2026,m=8;
      for(let i=0;i<rem;i++){add(y,m,p.name,toMXN(pg.mensualidad,p.cur),'mensual');m++;if(m>11){m=0;y++;}}
      if(final>0){if(pg.fecha){const[fy,fm]=pg.fecha.split('-').map(Number);add(fy,fm-1,p.name,final,'final');}else add(y,m,p.name,final,'final');}}
    else if(final>0&&pg.fecha){const[fy,fm]=pg.fecha.split('-').map(Number);add(fy,fm-1,p.name,final,'final');}});
  return flows;
}

/* ---------- GitHub ---------- */
function ghReady(){const g=state.github||{};return !!(g.owner&&g.repo&&localStorage.getItem('abm_gh_token'));}
async function uploadImageToGitHub(dataUrl,propId){
  const g=state.github||{},token=localStorage.getItem('abm_gh_token');
  const m=dataUrl.match(/^data:image\/([\w+.-]+);base64,(.+)$/);if(!m)return dataUrl;
  const ext=(m[1]==='jpeg'?'jpg':m[1]).replace(/[^a-z0-9]/gi,'');const b64=m[2];
  const path=(g.folder||'propiedades').replace(/^\/+|\/+$/g,'')+'/'+propId+'_'+Date.now()+'.'+ext;
  const url='https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/'+encodeURI(path);
  const res=await fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},
    body:JSON.stringify({message:'img '+propId,content:b64,branch:g.branch||'main'})});
  if(!res.ok){let msg=res.status;try{const ej=await res.json();if(ej&&ej.message)msg=res.status+' · '+ej.message;}catch(_){}throw new Error(msg);}
  const j=await res.json();return (j.content&&j.content.download_url)||dataUrl;
}

function cellStr(v){if(v==null)return '';if(v instanceof Date)return v.toISOString().slice(0,10);return String(v).trim();}
function importExcel(file){
  if(!xlsxReady())return;
  const r=new FileReader();
  r.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
    const sp=wb.Sheets['Propiedades'];if(!sp){toast('El archivo no tiene la hoja “Propiedades”');return;}
    const rows=XLSX.utils.sheet_to_json(sp,{defval:''});
    const np=rows.filter(x=>cellStr(x.Nombre)).map(x=>{const num=k=>parseFloat(x[k])||0;
      const mens=num('Mensualidad'),fin=num('Pago final'),tot=num('Cuotas totales');
      const pago=(mens||fin||tot)?{mensualidad:mens,pagoFinal:fin,done:num('Cuotas pagadas'),total:tot,fecha:cellStr(x['Fecha pago final']).slice(0,7)||null,nota:cellStr(x['Nota pago'])}:null;
      return {id:cellStr(x.ID)||slug(cellStr(x.Nombre)),img:cellStr(x.Imagen),name:cellStr(x.Nombre),sub:cellStr(x['Subtítulo']),emp:cellStr(x.Empresa)||'TERRALIA',tipo:cellStr(x.Tipo)||'Residencial',ciudad:cellStr(x.Ciudad),zona:cellStr(x.Zona),estatus:cellStr(x.Estatus)||'Rentado',cur:cellStr(x.Moneda)||'MXN',m2:num('m2'),anio:num('Año')||2026,arr:cellStr(x.Arrendatario),renta:num('Renta mensual'),va:num('Valor adquisición'),vm:num('Valor mercado'),adeudo:num('Adeudo'),pago};});
    let ng=[];const sg=wb.Sheets['Gastos'];
    if(sg)ng=XLSX.utils.sheet_to_json(sg,{defval:''}).filter(x=>parseFloat(x.Monto)).map(x=>({id:cellStr(x.ID)||uid(),fecha:cellStr(x.Fecha).slice(0,10),propId:cellStr(x.PropiedadID),tipo:cellStr(x.Tipo)||'Otro',monto:parseFloat(x.Monto)||0,nota:cellStr(x.Nota)}));
    if(!np.length){toast('No se encontraron propiedades en el archivo');return;}
    askImportMode(np,ng);
  }catch(err){console.error(err);toast('No se pudo leer el Excel');}};
  r.readAsArrayBuffer(file);
}
function askImportMode(np,ng){
  openModal(`<div class="modal-head"><h3>Importar datos</h3><button class="close-m" id="m-close">×</button></div>
    <div class="modal-body"><p class="muted" style="font-size:13px;margin-bottom:16px">Se leyeron <b>${np.length}</b> propiedades${ng.length?` y <b>${ng.length}</b> gastos`:''}. ¿Cómo quieres aplicarlos?</p>
    <div class="import-opts">

      <button class="imp-opt" id="imp-replace"><b>Reemplazar todo</b><span>Borra los datos actuales y deja únicamente lo importado.</span></button>
    </div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancelar</button></div></div>`);

function applyImport(np,ng,mode){
  if(mode==='replace'){state.props=np;state.gastos=ng;}
  else{
    const pm=new Map(state.props.map(p=>[p.id,p]));
    np.forEach(p=>{if(pm.has(p.id))Object.assign(pm.get(p.id),p);else{state.props.push(p);pm.set(p.id,p);}});
    const gm=new Map(state.gastos.map(g=>[g.id,g]));
    ng.forEach(g=>{if(gm.has(g.id))Object.assign(gm.get(g.id),g);else state.gastos.push(g);});
  }
  save();closeModal();renderAll();nav('catalogo');toast(mode==='merge'?'Datos fusionados':'Datos reemplazados');
}
/* ---------- Respaldo JSON en GitHub (manual + automático) ---------- */
let backupT=null,backupInFlight=false,backupAgain=false;
function scheduleBackup(){ if(!ghReady()||state.github.auto===false){setGhStatus('off');return;} clearTimeout(backupT); setGhStatus('pending'); backupT=setTimeout(runAutoBackup,4000); }
async function runAutoBackup(){ if(backupInFlight){backupAgain=true;return;} backupInFlight=true; try{await backupToGitHub(true);}finally{backupInFlight=false; if(backupAgain){backupAgain=false;scheduleBackup();}} }
function setGhStatus(s){ const el=document.getElementById('gh-status'); if(!el)return;
  const n=new Date(),hh=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const map={off:'',ready:'· Auto-respaldo activo',pending:'● Respaldo pendiente…',syncing:'● Respaldando…',ok:'✓ Respaldado '+hh,err:'⚠ Error de respaldo'};
  el.textContent=map[s]||''; el.className='gh-status '+s; }
async function backupToGitHub(silent){
  if(!ghReady()){ if(!silent){toast('Configura primero el repositorio y el token de GitHub');nav('parametros');} return; }
  const g=state.github,token=localStorage.getItem('abm_gh_token');
  const path='backups/portafolio.json';
  const api='https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/'+path;
  const hdr={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  if(!silent)toast('Respaldando en GitHub…'); setGhStatus('syncing');
  try{
    let sha=null;
    const head=await fetch(api+'?ref='+(g.branch||'main'),{headers:hdr});
    if(head.ok){const hj=await head.json();sha=hj.sha;}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))));
    const body={message:'Respaldo portafolio '+new Date().toISOString(),content,branch:g.branch||'main'};
    if(sha)body.sha=sha;
    const res=await fetch(api,{method:'PUT',headers:hdr,body:JSON.stringify(body)});
    if(!res.ok){let msg=res.status;try{const ej=await res.json();if(ej&&ej.message)msg=res.status+' · '+ej.message;}catch(_){}throw new Error(msg);}
    setGhStatus('ok'); if(!silent)toast('Respaldo subido a GitHub · backups/portafolio.json');
  }catch(e){setGhStatus('err'); toast('No se pudo respaldar en GitHub: '+e.message);}
}

function esc(s){return String(s).replace(/"/g,'&quot;');}

function pickPropertyThen(cb){ if(READONLY)return;
  const opts=state.props.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal(`<div class="modal-head"><h3>Registrar adeudo</h3><button class="close-m" id="m-close">×</button></div>
    <div class="modal-body"><div class="field full"><label>Selecciona la propiedad</label><select id="pick">${opts}</select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="pick-go">Continuar</button></div></div>`);
  document.getElementById('m-close').onclick=closeModal;document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('pick-go').onclick=()=>{const id=document.getElementById('pick').value;closeModal();cb(id);};
}

function openGastoForm(){ if(READONLY)return;
  const opts=state.props.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal(`<div class="modal-head"><h3>Agregar gasto</h3><button class="close-m" id="m-close">×</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field"><label>Fecha</label><input type="date" id="g-fecha" value="2026-08-10"></div>
      <div class="field"><label>Tipo de gasto</label><select id="g-tipo">${TIPOS_GASTO.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field full"><label>Propiedad</label><select id="g-prop">${opts}</select></div>
      <div class="field"><label>Monto</label><input type="number" id="g-monto" placeholder="0.00"></div>
      <div class="field"><label>Nota (opcional)</label><input id="g-nota"></div>
    </div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="g-save">Guardar gasto</button></div></div>`);
  document.getElementById('m-close').onclick=closeModal;document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('g-save').onclick=()=>{const monto=parseFloat(document.getElementById('g-monto').value)||0;if(monto<=0){toast('Escribe un monto');return;}
    state.gastos.push({id:uid(),fecha:document.getElementById('g-fecha').value,propId:document.getElementById('g-prop').value,tipo:document.getElementById('g-tipo').value,monto,nota:document.getElementById('g-nota').value.trim()});
    save();closeModal();nav('gastos');renderGastos();renderAll(false);toast('Gasto agregado');};
}

/* ================= TOAST / RENDER ================= */
let toastT;
function toast(msg){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function fxLabels(){document.getElementById('fx-eur-lbl').textContent=fx().EUR;document.getElementById('fx-usd-lbl').textContent=fx().USD;}
function renderAll(reFicha=true){renderCatalogo();renderAnalisis();renderAdeudos();renderGastos();renderParametros();fxLabels();if(reFicha&&openId)openFicha(openId);}
document.getElementById('foot-date').textContent='Base · 10 agosto 2026';
fxLabels();renderAll();
loadFromCloud();
async function loadFromCloud(){
  try{
    const res=await fetch('https://raw.githubusercontent.com/terraliaadm/Terraliaprop/main/backups/portafolio.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const j=await res.json();
    if(j&&Array.isArray(j.props)){state=normalize(j);renderAll();}
  }catch(e){}
}

</script>
